socket {
    listen 8099;
    host 127.0.0.1;

    domain aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.local {
        root /root/benoitlastpush/www-really-long-path-segment-for-parser-stress-testing-of-configuration-handling;
        client_max_body_size 2147483647;
        index index.html;

        location /cgi-bin {
            root /root/benoitlastpush/www;
            allow_methods GET POST DELETE;
            index stress.py;
            interpreter .py /usr/bin/python3;
            interpreter .sh /bin/bash;
        }

        location / {
            allow_methods GET POST DELETE;
            autoindex off;
        }
    }
}
