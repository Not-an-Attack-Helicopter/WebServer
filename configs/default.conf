socket {
	listen 8080;
	host 127.0.0.1;
	client_max_body_size 100;

	domain example.com www.example.com {
		root /home/ben/Public/example.com/html;
		index index.html;
		error_page 400 /home/ben/Public/example.com/errors/400.html;
		error_page 403 /home/ben/Public/example.com/errors/403.html;
		error_page 404 /home/ben/Public/example.com/errors/404.html;
		error_page 405 /home/ben/Public/example.com/errors/405.html;
		error_page 413 /home/ben/Public/example.com/errors/413.html;
		error_page 500 /home/ben/Public/example.com/errors/500.html;
		error_page 505 /home/ben/Public/example.com/errors/505.html;

		location / {
			# Maps to /home/ben/Public/example.com/html/
			# Serves /home/ben/Public/example.com/html/index.html,
			# /home/ben/Public/html/about.html, etc.
			index index.html;
			allow_methods GET HEAD;
		}

		location /css {
			# Maps to /home/ben/Public/example.com/html/css/
			allow_methods GET HEAD;
			autoindex off;
		}

		location /blog {
			# Maps to /home/ben/Public/example.com/html/blog/
			allow_methods GET HEAD;
			autoindex on;
			# directory_listing on;
			# autoindex_stencil
		}

		location /products {
			# Maps to /home/ben/Public/example.com/html/products/
			allow_methods GET HEAD;
			autoindex off;
		}

		location /wardrobe {
			# Maps to /home/ben/Public/example.com/html/narnia/
			redirect /narnia/;
		}

		location /narnia {
			# Maps to /home/ben/Public/example.com/html/narnia/
			# index index.html;
			allow_methods GET HEAD;
		}

		location /warez {
			# Maps to /home/ben/Public/example.com/warez/
			root /home/ben/Public/example.com;
			# alias /home/ben/Public/example.com/warez;
			allow_methods GET HEAD;
			autoindex on;
		}

		location /jesus {
			# Maps to /home/ben/Public/example.com/satan/
			alias /home/ben/Public/example.com/satan;
			allow_methods HEAD POST;
			# upload_dir /../uploads;
			upload_dir /prayers;
			client_max_body_size 8589934592;
		}

		location /prayers {
			# Maps to /home/ben/Public/satan/prayers/
			alias /home/ben/Public/example.com/satan/prayers;
			allow_methods DELETE GET HEAD PATCH PUT;
			autoindex on;
			# upload_dir /../uploads;
			client_max_body_size 8589934592;
		}

		location /cgi-bin {
			# Maps to /home/ben/Public/example.com/cgi-bin/
			root /home/ben/Public/example.com;
			allow_methods DELETE GET HEAD PATCH POST PUT;
			upload_dir /../cache;
			interpreter .php /run/current-system/sw/bin/php-cgi;
			interpreter .pl /run/current-system/sw/bin/perl;
			interpreter .py /run/current-system/sw/bin/python3;
			interpreter .rb /run/current-system/sw/bin/ruby
			interpreter .sh /run/current-system/sw/bin/bash;
		}

		location /cgi-alt {
			# Maps to /home/ben/Public/example.com/other-cgi-bin/
			alias /home/ben/Public/example.com/other-cgi-bin;
			allow_methods DELETE GET HEAD PATCH POST PUT;
			upload_dir /../cache;
			interpreter .php /run/current-system/sw/bin/php-cgi;
			interpreter .pl /run/current-system/sw/bin/perl;
			interpreter .py /run/current-system/sw/bin/python3;
			interpreter .rb /run/current-system/sw/bin/ruby
			interpreter .sh /run/current-system/sw/bin/bash;
		}

		location /api {
			# Maps to /home/ben/Public/example.com/api/
			root /home/ben/Public/example.com;
			allow_methods DELETE GET HEAD POST;
		}
	}

	domain example.net www.example.net {
		root /home/ben/Public/example.net/html;
		index index.html;
		error_page 400 /home/ben/Public/example.net/errors/400.html;
		error_page 403 /home/ben/Public/example.net/errors/403.html;
		error_page 404 /home/ben/Public/example.net/errors/404.html;
		error_page 405 /home/ben/Public/example.net/errors/405.html;
		error_page 500 /home/ben/Public/example.net/errors/500.html;
		error_page 505 /home/ben/Public/example.net/errors/505.html;

		location / {
			# Maps to /home/ben/Public/example.net/html/
			# Serves /home/ben/Public/example.net/html/index.html,
			# /home/ben/Public/example.net/html/about.html, etc.
			# index index.html;
			allow_methods GET HEAD;
		}

		location /html {
			# Maps to /home/ben/Public/example.net/html/
			alias /home/ben/Public/example.net/html;
			allow_methods GET HEAD;
			autoindex off;
		}
	}
}
