socket {
	listen 8080;
	host 127.0.0.1;

	domain bad-location.local {
		root /var/www;
		index index.html;

		location / {
			root /var/www/html;
			allow_methods GET;
			autoindex off;
		}

		location cgi-bin {
            root /var/www/cgi-bin;
			allow_methods GET POST;
			interpreter .py /run/current-system/sw/bin/python3;
		}
	}
}
