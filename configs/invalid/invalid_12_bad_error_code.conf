socket {
	listen 8080;
	host 127.0.0.1;

	domain bad-body-size.local {
		root /var/www;
		index index.html;
		error_page 200 /200.html;

		location / {
			root /var/www/html;
			allow_methods GET;
			autoindex off;
		}

		location /upload {
			alias /var/www/uploads;
			allow_methods HEAD POST;
		}
	}
}
