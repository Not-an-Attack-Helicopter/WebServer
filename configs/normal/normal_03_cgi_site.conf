socket {
    listen 8085;
    host 127.0.0.1;

    domain cgi.local {
        root /root/benoitlastpush/www;
        index index.html;

        location / {
            allow_methods GET;
            autoindex off;
        }

        location /cgi-bin {
            root /root/benoitlastpush/www;
            allow_methods GET POST;
            index time.py;
            interpreter .py /usr/bin/python3;
            interpreter .sh /bin/bash;
        }
    }
}
