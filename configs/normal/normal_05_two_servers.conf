socket {
    listen 8087;
    host 127.0.0.1;

    domain app.local {
        root /root/benoitlastpush/www;
        index index.html;

        location / {
            allow_methods GET POST;
            autoindex off;
        }
    }
}

socket {
    listen 8088;
    host 127.0.0.1;

    domain admin.local {
        root /root/benoitlastpush/www;
        index index.html;

        location / {
            allow_methods GET;
            autoindex off;
        }

        location /logs {
            allow_methods GET;
            autoindex on;
            index index.html;
        }
    }
}
