server {
    listen 8080;
    host 127.0.0.1;
    server_name invalid_cgi;

    location /cgi-bin/ {
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    listen 8080;
    host 127.0.0.2;
    server_name invalid_cgi;

    location /cgi-bin/ {
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}