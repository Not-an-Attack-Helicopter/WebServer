server {
	listen 8077;
	server_name app.local;
	host 0.0.0.0;
	root docs/fusion_web/;
	index index.html;

	location / {
		allow_methods GET POST;
		autoindex off;
	}
}

server {
	listen 8091;
	server_name admin.local;
	host 0.0.0.0;
	root docs/fusion_web/;
	index index.html;

	location / {
		allow_methods GET;
		autoindex off;
	}

	location /logs {
		allow_methods GET;
		autoindex on;
		index index.html;
	}
}
