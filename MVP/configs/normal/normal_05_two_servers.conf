server {
    listen 8087;
    server_name app.local;
    host 127.0.0.1;
    root docs/fusion_web/;
    index index.html;

    location / {
        allow_methods GET POST;
        autoindex off;
    }
}

server {
    listen 8088;
    server_name admin.local;
    host 127.0.0.1;
    root docs/fusion_web/;
    index index.html;

    location / {
        allow_methods GET;
        autoindex off;
    }

    location /logs {
        allow_methods GET;
        autoindex on;
        index index.html;
    }
}
