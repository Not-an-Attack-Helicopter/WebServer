server {
    listen 8080;
    host 127.0.0.1;
    server_name tester.local;
    root /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/html;
    index index.html;
    client_max_body_size 100;

    error_page 400 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/400.html;
    error_page 403 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/403.html;
    error_page 404 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/404.html;
    error_page 405 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/405.html;
    error_page 500 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/500.html;
    error_page 505 /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/MyServer/errors/505.html;

    # Tester requirement: / must answer to GET only.
    location / {
        allow_methods GET;
        autoindex off;
    }

    # Tester requirement: /post_body must accept POST with a max body size of 100.
    # The body limit is enforced globally via client_max_body_size above.
    location /post_body {
        allow_methods POST;
        autoindex off;
    }

    # Tester requirement: /directory/ should expose the YoupiBanane repository and
    # search for youpi.bad_extension as the index file.
    location /directory {
        root /mnt/c/Users/Sebwo/OneDrive/Desktop/42-Coding/WebServer/MVP/YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex off;
    }

    # Tester requirement not expressible in the current MVP config/dispatcher:
    # files ending in .bla should execute cgi_test on POST.
    # The current parser only accepts interpreter mappings for .py and .sh,
    # and the current dispatcher does not execute CGI yet.
}
