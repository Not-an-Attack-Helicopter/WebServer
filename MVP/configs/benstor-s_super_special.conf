server {
	listen 44444;
	host 192.168.178.50;
	server_name example.lu;
	root /home/ben/NotAnAttackHelicopter/MVP/test;
	# client_max_body_size 3000000;
	index index.html;
	error_page 404 error/404.html;

	location /directory {
		allow_methods GET POST DELETE;
		autoindex on;
	}

	location /pages {
		autoindex off;
		index main/index.html;
		allow_methods DELETE POST GET;
	}

	location /red {
		redirect /detours;
	}

	location /cgi-bin {
		root /home/ben/NotAnAttackHelicopter/MVP/cgi-bin;
		allow_methods GET POST DELETE;
		index cgi-bin/time.py;
		# cgi_path /usr/bin/python3 /bin/bash;
		# cgi_ext .py .sh;
		interpreter .py /usr/bin/python3
		interpreter .sh /bin/bash
	}
}

server {
	listen 55555;
	host 192.168.178.50;
	server_name example.com;
	root /home/ben/NotAnAttackHelicopter/MVP/docs/fusion_web;
	# client_max_body_size 3000000;
	index index.html;
	error_page 404 pages/error/404.html;

	location / {
		allow_methods GET POST DELETE;
		autoindex off;
	}

	location /tours {
		autoindex on;
		index tours1.html;
		allow_methods GET POST DELETE;
	}

	location /red {
		redirect /tours;
	}

	location /cgi-bin {
		root /home/ben/NotAnAttackHelicopter/MVP/cgi-bin;
		allow_methods GET POST DELETE;
		index time.py;
		# cgi_path /usr/bin/python3 /bin/bash;
		# cgi_ext .py .sh;
		interpreter .py /usr/bin/python3
		interpreter .sh /bin/bash
	}
}

server {
	listen 8077;
	host 127.0.0.1;
	server_name app.local;
	root /home/ben/NotAnAttackHelicopter/MVP/docs/fusion_web;
	index index.html;

	location / {
		allow_methods GET POST;
		autoindex off;
	}
}

server {
	listen 8091;
	host 127.0.0.1;
	server_name admin.local;
	root /home/ben/NotAnAttackHelicopter/MVP/docs/fusion_web;
	index index.html;

	location / {
		allow_methods GET;
		autoindex off;
	}

	location /logs {
		allow_methods GET;
		autoindex on;
		index index.html;
	}
}
